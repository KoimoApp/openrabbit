name: Publish OpenRabbit release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag to publish, for example v0.2.0
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Publish release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "${VERSION}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must be a SemVer tag prefixed with v"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: OpenRabbit ${{ inputs.version }}
          generate_release_notes: true
