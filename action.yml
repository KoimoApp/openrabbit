name: OpenRabbit
description: GitHub Action that generates PR review summaries and inline comments using any LLM provider.
inputs:
  github_token:
    description: GitHub token for PR review actions
    required: false
  llm_provider:
    description: LLM provider key
    required: false
    default: openrouter
  llm_api_url:
    description: Base URL for the LLM provider
    required: false
    default: https://openrouter.ai/api/v1
  llm_api_key:
    description: API key for the LLM provider
    required: false
  llm_model:
    description: Model name for the configured LLM provider
    required: false
    default: openrouter/free
  llm_reasoning_effort:
    description: Reasoning effort passed to compatible OpenAI chat-completions providers
    required: false
    default: medium
  request_timeout_ms:
    description: Maximum time for each LLM request, in milliseconds (1000-600000)
    required: false
    default: '120000'
  review_timeout_ms:
    description: Maximum total time for the complete PR review, in milliseconds (1000-3600000)
    required: false
    default: '240000'
  review_mode:
    description: Create summary, inline comments, or both
    required: false
    default: both
  tone_mode:
    description: Tone profile for the review output
    required: false
    default: balanced
  review_lens:
    description: Focused review lens (default, security, socratic, performance, scope-guard)
    required: false
    default: default
  debiased_mode:
    description: Redact PR metadata for the initial pass
    required: false
    default: "false"
runs:
  using: node24
  main: dist/index.js
